[package]
name = "wasm-devkit-warg"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
license = "Apache-2.0"
description = "Optional Warg network provider for wasm-devkit"

[dependencies]
warg-client = { version = "=0.9.0", default-features = false, features = ["rustls-tls", "keyring"] }
warg-protocol = "=0.9.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "time"] }
url = "=2.5.8"
