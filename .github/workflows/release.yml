name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged into main, without a v prefix
        type: string
        required: true
      dry_run:
        description: Validate without publishing packages or creating a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  validate:
    name: Validate libraries, CLI and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate requested version and finished notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: mise run release:validate -- "$RELEASE_VERSION"
      - run: mise run check
      - run: mise run test:scripts
      - name: Record validated source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Validate native on Windows
    needs: [validate]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'
      - run: moon update
      - run: moon check --deny-warn
      - run: moon build --target native --release
      - run: moon test --target native


  cli:
    name: CLI (${{ matrix.platform }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux-x64}
          - {os: macos-latest, platform: macos-arm64}
          - {os: windows-latest, platform: windows-x64}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: ./.github/actions/setup
        if: runner.os != 'Windows'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: hustcer/setup-moonbit@v1
        if: runner.os == 'Windows'
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24.14.1'
      - run: moon update
      - run: moonx scripts/test-cli.mbtx wasm
      - run: moonx scripts/build-cli.mbtx ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-devkit-${{ matrix.platform }}
          path: |
            dist/wasm-devkit-*.tar.gz
            dist/wasm-devkit-*.sha256
          if-no-files-found: error

  publish:
    name: Publish libraries, CLI and GitHub release
    if: ${{ !inputs.dry_run }}
    needs: [validate, windows, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify requested version again
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: mise run release:validate -- "$RELEASE_VERSION"
      - name: Configure registry credentials
        env:
          MOONCAKES_USER_TOKEN: ${{ secrets.MOONCAKES_USER_TOKEN }}
        run: mise run release:credentials
      - run: mise run release:publish
      - name: Verify moonx installation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: mise run release:verify-cli -- moonx "$RELEASE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          pattern: wasm-devkit-*
          path: dist
          merge-multiple: true
      - name: Create the GitHub release at the validated commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: mise run release:github -- "$RELEASE_VERSION"
      - name: Verify native mise installation
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: mise run release:verify-cli -- mise "$RELEASE_VERSION"
