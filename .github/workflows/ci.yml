name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run lint
      - run: mise run validate

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run build -- ${{ matrix.target }} --release

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run test -- ${{ matrix.target }}

  windows:
    name: Build and test native (Windows)
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'
      - run: moon update
      - run: moon check --deny-warn
      - run: moon build --target native --release
      - run: moon test --target native

  test-native-zig:
    name: Test native (zig)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run test:native-zig

  test-scripts:
    name: Test task scripts
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run test:scripts

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, build, test, windows, test-native-zig, test-scripts]
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
