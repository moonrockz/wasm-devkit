name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run lint
      - run: mise run validate

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run build -- ${{ matrix.target }} --release

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run test -- ${{ matrix.target }}
      - run: mise run test:docs -- ${{ matrix.target }}

  windows:
    name: Build and test native (Windows)
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'
      - run: moon update
      - run: moon check --deny-warn
      - run: moon build --target native --release
      - run: moon test --target native

  test-native-zig:
    name: Test native (zig)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run test:native-zig

  test-scripts:
    name: Test task scripts
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run test:scripts


  cli:
    name: CLI (${{ matrix.platform }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux-x64}
          - {os: macos-latest, platform: macos-arm64}
          - {os: windows-latest, platform: windows-x64}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        if: runner.os != 'Windows'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: hustcer/setup-moonbit@v1
        if: runner.os == 'Windows'
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24.14.1'
      - run: moon update
      - run: moonx scripts/test-cli.mbtx wasm
      - run: moonx scripts/build-cli.mbtx ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-devkit-${{ matrix.platform }}
          path: |
            dist/wasm-devkit-*.tar.gz
            dist/wasm-devkit-*.sha256
          if-no-files-found: error

  semantic-reference:
    name: Pinned semantic references
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .dev/reference-target
            .dev/reference-cli
          key: semantic-${{ runner.os }}-1.94.1-${{ hashFiles('tools/**/Cargo.lock', 'scripts/build-semantic-*') }}
      - run: mise run build:semantic-tools
      - run: mise run test:semantics -- .dev/reference-cli/bin/wasm-tools .dev/reference-cli/bin/wac

  registry-reference:
    name: Controlled registry references
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .dev/warg-target
          key: registry-${{ runner.os }}-1.94.1-${{ hashFiles('tools/*/Cargo.lock') }}
      - run: mise run build:registry-reference
      - run: mise run test:registry -- native
      - run: mise run test:registry -- wasm

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, build, test, windows, test-native-zig, test-scripts, cli, semantic-reference, registry-reference]
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
